<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AprilTag – Live Detection</title>
  <style>
    body { margin:0; background:#0b0f1a; color:#eaf2ff;
           font-family:sans-serif; display:flex; flex-direction:column;
           align-items:center; justify-content:center; height:100vh; }
    video,canvas { width:100%; max-width:800px; border-radius:10px; }
    #status { margin-top:12px; font-weight:bold; }
    .ok { color:#5cff7a; }
    .error { color:#ff5c5c; }
  </style>
</head>
<body>
  <h1>📷 AprilTag – Live Detection</h1>
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="status">Status: Initialisiere…</div>

  <script>
    const APRILTAG_JS   = './apriltag_wasm.js';
    const APRILTAG_WASM = './apriltag_wasm.wasm';
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d', { willReadFrequently: true });

    function setStatus(msg, ok=false) {
      statusEl.textContent = "Status: " + msg;
      statusEl.className = ok ? "ok" : "error";
    }

    async function checkFiles() {
      try {
        const js = await fetch(APRILTAG_JS, {method:'HEAD'});
        if (!js.ok) { setStatus("apriltag_wasm.js fehlt ❌"); return false; }
        const wasm = await fetch(APRILTAG_WASM, {method:'HEAD'});
        if (!wasm.ok) { setStatus("apriltag_wasm.wasm fehlt ❌"); return false; }
        setStatus("Dateien gefunden ✅", true);
        return true;
      } catch(e) {
        setStatus("Fehler beim Prüfen: "+e.message);
        return false;
      }
    }

    async function start() {
      if (!(await checkFiles())) return;

      const video = document.getElementById('video');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } });
        video.srcObject = stream;
        await video.play();
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        setStatus("Kamera läuft ✅", true);
      } catch(e) {
        setStatus("Kamera-Fehler: "+e.message);
        return;
      }

      // AprilTag vorbereiten
      window.Module = { locateFile: (p)=> p.endsWith('.wasm') ? APRILTAG_WASM : p };
      const s = document.createElement('script');
      s.src = APRILTAG_JS; s.async = true;
      s.onload = ()=> initAprilTag(video);
      s.onerror = ()=> setStatus("AprilTag JS konnte nicht geladen werden ❌");
      document.head.appendChild(s);
    }

    async function initAprilTag(video) {
      setStatus("AprilTag wird initialisiert…");
      try {
        const apriltag = await window.Apriltag({ locateFile:(p)=>p.endsWith('.wasm')?APRILTAG_WASM:p });
        if (!apriltag.detect) {
          setStatus("detect() nicht verfügbar ❌");
          return;
        }
        setStatus("AprilTag bereit ✅", true);
        detectLoop(video, apriltag);
      } catch(e) {
        setStatus("Init-Fehler: "+e.message);
      }
    }

    function toGray8(imgData,w,h){
      const g=new Uint8Array(w*h),d=imgData.data;
      for(let i=0,j=0;i<d.length;i+=4,j++){
        g[j]=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)|0;
      }
      return g;
    }

    function draw(dets){
      ctx.clearRect(0,0,overlay.width,overlay.height);
      ctx.lineWidth=3; ctx.strokeStyle='#00e0ff'; ctx.fillStyle='#00e0ff';
      for(const d of dets){
        if(d.corners){
          ctx.beginPath();
          ctx.moveTo(d.corners[0].x,d.corners[0].y);
          for(let i=1;i<d.corners.length;i++) ctx.lineTo(d.corners[i].x,d.corners[i].y);
          ctx.closePath(); ctx.stroke();
        }
        if(d.center){
          ctx.beginPath();
          ctx.arc(d.center.x,d.center.y,5,0,2*Math.PI);
          ctx.fill();
          ctx.fillText("ID:"+d.id,d.center.x+8,d.center.y-8);
        }
      }
    }

    function detectLoop(video, apriltag) {
      const work=document.createElement('canvas');
      const wctx=work.getContext('2d',{willReadFrequently:true});
      work.width=video.videoWidth; work.height=video.videoHeight;

      async function step(){
        wctx.drawImage(video,0,0,work.width,work.height);
        const img=wctx.getImageData(0,0,work.width,work.height);
        const gray=toGray8(img,work.width,work.height);
        let raw=[];
        try{ raw=apriltag.detect(gray,work.width,work.height)||[]; }
        catch(e){ setStatus("Detect-Fehler: "+e.message); }
        const dets=raw.map(d=>({
          id:d.id,
          center:{x:d.center.x,y:d.center.y},
          corners:(d.corners||[]).map(p=>({x:p.x,y:p.y}))
        }));
        draw(dets);
        requestAnimationFrame(step);
      }
      step();
    }

    start();
  </script>
</body>
</html>
