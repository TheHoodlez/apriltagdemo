<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AprilTag – Live Detection (tag36h11)</title>
  <style>
    :root{--bg:#0b0f1a;--fg:#eaf2ff;--panel:#121a2a}
    *{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center}
    .wrap{width:min(100vw,900px);padding:16px}
    h1{margin:0 0 10px;font-size:24px}
    .view{position:relative;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.45)}
    video,canvas{width:100%;display:block}
    .hud{position:absolute;inset:0;pointer-events:none}
    .panel{margin-top:12px;background:var(--panel);border:1px solid #213253;border-radius:10px;padding:10px}
    #status{font-weight:600}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📷 AprilTag – Live Detection (tag36h11)</h1>
    <div class="view">
      <video id="video" autoplay playsinline></video>
      <canvas id="hud" class="hud"></canvas>
    </div>
    <div class="panel">
      <div id="status">Status: Initialisiere…</div>
    </div>
  </div>

  <script>
    // ---- Dateien liegen NEBEN index.html
    const APRILTAG_JS   = './apriltag_wasm.js';
    const APRILTAG_WASM = './apriltag_wasm.wasm';

    const statusEl = document.getElementById('status');
    const setStatus = (t)=> statusEl.textContent = 'Status: ' + t;

    // Sichtbares Overlay
    const hud = document.getElementById('hud');
    const banner = (msg)=>{
      const ctx = hud.getContext('2d');
      ctx.clearRect(0,0,hud.width,hud.height);
      if(!msg) return;
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.fillRect(10,10, 24+msg.length*8.6, 36);
      ctx.fillStyle='#00e0ff';
      ctx.font='16px system-ui, Arial';
      ctx.fillText(msg, 20, 34);
      ctx.restore();
    };

    // Vorab prüfen, ob die Dateien erreichbar sind
    (async()=>{
      try{
        const j = await fetch(APRILTAG_JS, {method:'HEAD'}); setStatus(j.ok?'JS gefunden ✅':'JS fehlt ❌');
        const w = await fetch(APRILTAG_WASM,{method:'HEAD'}); setStatus((j.ok&&w.ok)?'JS+WASM gefunden ✅':'WASM fehlt ❌');
      }catch{ setStatus('HEAD-Check fehlgeschlagen ❌'); }
    })();

    // Emscripten: wo die .wasm liegt
    window.Module = { locateFile: (p)=> p.endsWith('.wasm') ? APRILTAG_WASM : p };

    // Loader laden
    const s = document.createElement('script');
    s.src = APRILTAG_JS; s.async = true;
    s.onload = ()=> setStatus('JS geladen – warte auf Initialisierung…');
    s.onerror = ()=> { setStatus('JS konnte nicht geladen werden ❌'); banner('⚠️ apriltag_wasm.js nicht geladen'); };
    document.head.appendChild(s);
  </script>

  <script>
  (async () => {
    const video = document.getElementById('video');
    const ctx = hud.getContext('2d', { willReadFrequently:true });

    // Kamera
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
      video.srcObject = stream; await video.play();
      hud.width = video.videoWidth || 640; hud.height = video.videoHeight || 480;
      setStatus('Kamera bereit');
    } catch(e) { setStatus('Kamera-Fehler: '+e.message); banner('⚠️ Kamerazugriff fehlgeschlagen'); return; }

    // Auf Factory warten (MODULARIZE → Promise)
    const waitForFactory = async (ms=10000)=>{
      const t0 = performance.now();
      while(!window.Apriltag && performance.now()-t0<ms){ banner('ℹ️ Lade AprilTag…'); await new Promise(r=>setTimeout(r,100)); }
      return !!window.Apriltag;
    };
    if(!(await waitForFactory())){ setStatus('AprilTag JS nicht gefunden'); banner('⚠️ apriltag_wasm.js fehlt'); return; }

    // Instanz bauen
    let apriltag;
    try{
      apriltag = await window.Apriltag({ locateFile:(p)=>p.endsWith('.wasm')?APRILTAG_WASM:p });
      if(typeof apriltag.detect !== 'function'){ setStatus('AprilTag: detect() fehlt'); banner('⚠️ detect() nicht verfügbar'); return; }
      setStatus('AprilTag bereit'); banner('');
    }catch(e){ setStatus('Init-Fehler: '+e.message); banner('⚠️ AprilTag init fehlgeschlagen'); return; }

    // Helpers
    const toGray8 = (imgData,w,h)=>{
      const g=new Uint8Array(w*h),d=imgData.data; for(let i=0,j=0;i<d.length;i+=4,j++){ g[j]=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)|0; } return g;
    };
    const draw = (dets)=>{
      ctx.clearRect(0,0,hud.width,hud.height);
      ctx.lineWidth=3; ctx.strokeStyle='#00e0ff'; ctx.fillStyle='#00e0ff';
      for(const d of dets){
        const c=d.center, cs=d.corners||[];
        if(cs.length>=4){ ctx.beginPath(); ctx.moveTo(cs[0].x,cs[0].y); for(let i=1;i<4;i++) ctx.lineTo(cs[i].x,cs[i].y); ctx.closePath(); ctx.stroke(); }
        if(c){ ctx.beginPath(); ctx.arc(c.x,c.y,5,0,Math.PI*2); ctx.fill(); ctx.fillText('ID: '+d.id, c.x+8, c.y-8); }
      }
    };

    // Loop
    const work=document.createElement('canvas'), wctx=work.getContext('2d',{willReadFrequently:true});
    const scale=0.8; work.width=(video.videoWidth||640)*scale; work.height=(video.videoHeight||480)*scale;

    async function step(){
      wctx.drawImage(video,0,0,work.width,work.height);
      const img=wctx.getImageData(0,0,work.width,work.height);
      const gray=toGray8(img,work.width,work.height);
      let raw=[]; try{ raw=apriltag.detect(gray,work.width,work.height)||[]; }catch(e){ setStatus('Detect-Fehler: '+e.message); }
      const sx=hud.width/work.width, sy=hud.height/work.height;
      const dets=raw.map(d=>({ id:d.id, center:{x:d.center.x*sx,y:d.center.y*sy}, corners:(d.corners||[]).map(p=>({x:p.x*sx,y:p.y*sy})) }));
      draw(dets); requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
  </script>
</body>
</html>
