<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AprilTag Demo – Live</title>
  <style>
    body{margin:0;background:#0b0f1a;color:#eaf2ff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .wrap{width:min(100vw,850px);padding:14px}
    .view{position:relative;background:#000;border-radius:12px;overflow:hidden}
    video,canvas{width:100%;display:block}
    .hud{position:absolute;inset:0;pointer-events:none}
    .panel{margin-top:10px;background:#121a2a;padding:8px;border-radius:8px;font-size:14px}
    #status{font-weight:bold;color:#00e0ff}
    .error{color:#ff5c5c}
    .ok{color:#5cff7a}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📷 AprilTag – Live Detection</h1>

    <div class="view">
      <video id="video" autoplay playsinline></video>
      <canvas id="hud" class="hud"></canvas>
    </div>

    <div class="panel">
      <div id="status">Status: Initialisiere…</div>
    </div>
  </div>

  <script>
    // --- Pfade zu den Dateien (müssen genau so im Repo liegen!) ---
    const APRILTAG_JS   = '/apriltagdemo/vendor/apriltag/apriltag_wasm.js';
    const APRILTAG_WASM = '/apriltagdemo/vendor/apriltag/apriltag_wasm.wasm';

    const statusEl = document.getElementById('status');
    function setStatus(msg, cls=""){ statusEl.textContent="Status: "+msg; statusEl.className=cls; }

    // Prüfen ob JS erreichbar
    fetch(APRILTAG_JS, { method:"HEAD" }).then(r=>{
      if(r.ok){ setStatus("JS gefunden ✅","ok"); } 
      else { setStatus("JS fehlt ❌","error"); }
    }).catch(()=>setStatus("Fehler beim Laden von JS ❌","error"));

    // Prüfen ob WASM erreichbar
    fetch(APRILTAG_WASM, { method:"HEAD" }).then(r=>{
      if(r.ok){ setStatus("WASM gefunden ✅","ok"); } 
      else { setStatus("WASM fehlt ❌","error"); }
    }).catch(()=>setStatus("Fehler beim Laden von WASM ❌","error"));

    // Loader mit locateFile
    window.Module = { locateFile: (p)=> p.endsWith(".wasm") ? APRILTAG_WASM : p };
    const s=document.createElement("script");
    s.src=APRILTAG_JS; s.async=true;
    s.onload=()=>setStatus("JS geladen – warte auf Initialisierung…");
    s.onerror=()=>setStatus("JS konnte nicht geladen werden ❌","error");
    document.head.appendChild(s);
  </script>
</body>
</html>
