<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AprilTag Demo – Live</title>
  <style>
    :root{--bg:#0b0f1a;--fg:#eaf2ff;--panel:#121a2a}
    *{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center}
    .wrap{width:min(100vw,900px);padding:14px}
    h1{margin:0 0 10px;font-size:18px;color:#cfe3ff}
    .view{position:relative;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 8px 28px rgba(0,0,0,.45)}
    video,canvas{width:100%;display:block}
    .hud{position:absolute;inset:0;pointer-events:none}
    .panel{margin-top:10px;background:var(--panel);border:1px solid #213253;border-radius:12px;padding:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid #2a3b66;background:#0e1524;color:#cfe3ff;cursor:pointer}
    label{font-size:12px;opacity:.9}
    .stat{font-size:12px;opacity:.9}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📷 AprilTag – Live Detection (tag36h11)</h1>

    <div class="view">
      <video id="video" autoplay playsinline></video>
      <canvas id="hud" class="hud"></canvas>
    </div>

    <div class="panel">
      <button id="toggle" class="pill">⏸️ Pause</button>
      <label><input type="checkbox" id="mirror" checked> Spiegeln</label>
      <label>Skalierung <input type="range" id="scale" min="0.4" max="1.0" step="0.05" value="0.8"></label>
      <span id="status" class="stat">Status: init…</span>
    </div>
  </div>

  <!-- 1) Sagt dem Loader, wo die .wasm liegt (Root neben index.html) -->
  <script>
    window.Module = window.Module || {};
    window.Module.locateFile = function (path) {
      if (path.endsWith('.wasm')) return './apriltag_wasm.wasm';
      return path;
    };
    // Falls der Loader dieses Signal nutzt:
    window.Module.onRuntimeInitialized = function () {
      window.__APRILTAG_WASM_READY__ = true;
      console.log('[apriltag] onRuntimeInitialized');
    };
  </script>

  <!-- 2) Loader laden -->
  <script>
    const s = document.createElement('script');
    s.src = './apriltag_wasm.js';
    s.async = true;
    s.onload = () => console.log('[apriltag] JS geladen');
    s.onerror = () => console.error('[apriltag] JS NICHT gefunden');
    document.head.appendChild(s);
  </script>

  <!-- 3) App-Logik -->
  <script>
  (async () => {
    const video = document.getElementById('video');
    const hud = document.getElementById('hud');
    const ctx = hud.getContext('2d', { willReadFrequently:true });
    const statusEl = document.getElementById('status');
    const toggleBtn = document.getElementById('toggle');
    const mirrorCb = document.getElementById('mirror');
    const scaleEl = document.getElementById('scale');

    let running = true;
    let tag = null;            // Modul/Objekt mit detect()
    let ready = false;

    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently:true });

    function setStatus(txt){ statusEl.textContent = 'Status: ' + txt; }
    function drawStatusBox(text){
      ctx.clearRect(0,0,hud.width,hud.height);
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,.45)';
      ctx.fillRect(10,10, Math.min(460, 20 + text.length*7.2), 36);
      ctx.fillStyle='#00e0ff';
      ctx.font='16px system-ui, Arial';
      ctx.fillText(text, 20, 34);
      ctx.restore();
    }
    function fit() {
      hud.width = video.videoWidth || 640;
      hud.height = video.videoHeight || 480;
      const s = parseFloat(scaleEl.value || "0.8");
      work.width = Math.round((video.videoWidth||640) * s);
      work.height = Math.round((video.videoHeight||480) * s);
    }

    // Kamera starten
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
      video.srcObject = stream;
      await video.play();
      if (video.readyState>=2) fit(); else video.addEventListener('loadeddata', fit, { once:true });
      setStatus('Kamera bereit');
    }catch(e){
      setStatus('Kamerazugriff fehlgeschlagen: '+e.message);
      drawStatusBox('⚠️ Kamera-Fehler');
      return;
    }

    // --- ROBUSTE INITIALISIERUNG (Promise | Callable | new) ---
    async function initApriltag(maxMs=10000){
      const wait = (ms)=>new Promise(r=>setTimeout(r,ms));
      const t0 = performance.now();

      // Warte, bis der Loader "Apriltag" überhaupt bereitstellt
      while (!window.Apriltag && performance.now()-t0 < maxMs){
        drawStatusBox('ℹ️ Lade AprilTag…');
        await wait(100);
      }
      if (!window.Apriltag){ setStatus('AprilTag nicht gefunden'); return false; }

      try {
        let inst = null;
        // 1) Viele Emscripten-Builds liefern ein Promise, wenn man die Factory aufruft
        const res = window.Apriltag();
        if (res && typeof res.then === 'function') {
          console.log('[apriltag] Factory liefert Promise – warte…');
          inst = await res;
        } else if (res) {
          inst = res; // direktes Objekt
        } else {
          // 2) Falls Aufruf ohne new nicht klappt, versuch "new"
          try { inst = new window.Apriltag(); } catch {}
        }

        // 3) Alternativ-Exports (zur Sicherheit)
        if (!inst && window.AprilTag) {
          try { inst = window.AprilTag(); } catch { try { inst = new window.AprilTag(); } catch {} }
        }
        if (!inst && window.AprilTagDetector) {
          try { inst = window.AprilTagDetector(); } catch { try { inst = new window.AprilTagDetector(); } catch {} }
        }

        if (!inst) { setStatus('AprilTag Init fehlgeschlagen (keine Instanz)'); return false; }

        // Manche Builds setzen detect erst nach Runtime-Init
        if (!inst.detect) {
          const t1 = performance.now();
          while (!inst.detect && performance.now()-t1 < 3000) { await wait(50); }
        }

        if (typeof inst.detect !== 'function') {
          setStatus('AprilTag: detect() fehlt');
          console.error('[apriltag] Instanz ohne detect()', inst);
          return false;
        }

        tag = inst;
        ready = true;
        setStatus('AprilTag bereit');
        console.log('[apriltag] bereit', tag);
        return true;

      } catch (e) {
        console.error('[apriltag] Init-Fehler', e);
        setStatus('AprilTag init fehlgeschlagen: ' + e.message);
        return false;
      }
    }

    await initApriltag();

    // UI
    scaleEl.addEventListener('input', fit);
    toggleBtn.onclick = () => { running = !running; toggleBtn.textContent = running ? '⏸️ Pause' : '▶️ Start'; if (running) requestAnimationFrame(loop); };

    // Zeichnen
    function drawDetections(dets){
      ctx.clearRect(0,0,hud.width,hud.height);
      ctx.save();
      if (mirrorCb.checked){ ctx.translate(hud.width,0); ctx.scale(-1,1); }
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#00e0ff';
      ctx.fillStyle = '#00e0ff';
      for(const d of dets){
        const cs = d.corners || [];
        if (cs.length>=4){
          ctx.beginPath();
          ctx.moveTo(cs[0].x, cs[0].y);
          for(let i=1;i<4;i++) ctx.lineTo(cs[i].x, cs[i].y);
          ctx.closePath();
          ctx.stroke();
        }
        const c = d.center;
        if (c){ ctx.beginPath(); ctx.arc(c.x, c.y, 5, 0, Math.PI*2); ctx.fill();
          ctx.fillText('ID: ' + d.id, c.x+8, c.y-8); }
      }
      ctx.restore();
    }

    function toGray8(imgData, w, h){
      const g = new Uint8Array(w*h), d = imgData.data;
      for(let i=0,j=0;i<d.length;i+=4,j++){
        g[j] = (d[i]*0.2126 + d[i+1]*0.7152 + d[i+2]*0.0722) | 0;
      }
      return g;
    }

    async function detectOnce(){
      if (!ready || !tag) return [];
      wctx.save();
      wctx.clearRect(0,0,work.width,work.height);
      if (mirrorCb.checked){ wctx.translate(work.width,0); wctx.scale(-1,1); }
      wctx.drawImage(video, 0, 0, work.width, work.height);
      wctx.restore();

      const img = wctx.getImageData(0,0,work.width,work.height);
      const gray = toGray8(img, work.width, work.height);

      let raw=[];
      try{
        raw = tag.detect(gray, work.width, work.height) || [];
      }catch(e){
        setStatus('Detect-Fehler: '+e.message);
        console.error('[apriltag] detect()-Fehler', e);
        return [];
      }

      const sx = hud.width / work.width, sy = hud.height / work.height;
      return raw.map(d => ({
        id: d.id,
        center: { x: d.center.x*sx, y: d.center.y*sy },
        corners: (d.corners||[]).map(pt => ({ x: pt.x*sx, y: pt.y*sy }))
      }));
    }

    async function loop(){
      if (!running) return;
      if (!ready){ drawStatusBox('ℹ️ Lade AprilTag…'); requestAnimationFrame(loop); return; }
      const dets = await detectOnce();
      if (dets.length===0){ drawStatusBox('🔎 Keine Tags gefunden (tag36h11)'); }
      else { drawDetections(dets); }
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
